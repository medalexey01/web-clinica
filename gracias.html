<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¡Gracias! | Clínica Hispana América</title>

  <!-- SEO Técnico -->
  <meta name="robots" content="noindex, follow">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul-navy: #0A1E3C;
      --azul-primary: #1E40AF;
      --azul-claro: #F0F9FF;
      --text-color: #334155;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--text-color);
    }

    .card {
      background: white;
      padding: 60px 40px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(10, 30, 60, 0.15);
      text-align: center;
      max-width: 500px;
      width: 90%;
      border-top: 10px solid var(--azul-primary);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .check-icon {
      width: 100px;
      height: 100px;
      background: var(--azul-claro);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      color: var(--azul-primary);
      font-size: 50px;
      box-shadow: 0 10px 20px rgba(30, 64, 175, 0.1);
    }

    h1 {
      margin: 0 0 15px;
      color: var(--azul-navy);
      font-size: 36px;
      font-weight: 800;
      text-transform: uppercase;
    }

    p {
      font-size: 18px;
      color: #64748b;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background: var(--azul-navy);
      color: white;
      text-decoration: none;
      padding: 18px 40px;
      border-radius: 50px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
      box-shadow: 0 10px 25px rgba(10, 30, 60, 0.2);
    }

    .btn:hover {
      background: var(--azul-primary);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(10, 30, 60, 0.3);
    }

    .footer-note {
      margin-top: 40px;
      font-size: 14px;
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="card" style="border-top: 10px solid var(--elite-gold);">
    <div class="check-icon" style="background: var(--elite-white); color: var(--elite-gold);">✓</div>
    <h1 style="color: var(--elite-navy); font-family: 'Playfair Display', serif; font-style: italic;">¡Todo listo!</h1>
    <p style="color: var(--elite-text); font-weight: 500;">
      Hemos recibido su solicitud de prioridad clínica. Nuestro equipo de coordinación médica le contactará a la
      brevedad para confirmar su espacio.
    </p>
    <a href="index.html" class="btn" style="background: var(--elite-navy); border-radius: 5px;">Regresar a la
      Clínica</a>
    <div class="footer-note" style="color: var(--elite-gold); font-weight: 700; letter-spacing: 1px;">CLÍNICA HISPANA
      AMÉRICA</div>
  </div>
</body>

</html>
