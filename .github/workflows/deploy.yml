name: Deploy to Hostinger

# PRUEBA 20 oct 2026: sube solo _prueba_deploy/ a la carpeta real de clinicaha.com/pruebas.
# Solo manual hasta validar la ruta.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./_prueba_deploy/
          server-dir: /domains/clinicaha.com/public_html/pruebas/
